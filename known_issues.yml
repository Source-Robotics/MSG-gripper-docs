# The known issues of the MSG gripper's firmware and software, in ONE place: the faults that affect MSG users. The
# same hook as PAROL-docs: hooks/known_issues.py writes them into the Known issues page (<!-- known-issues -->, all of
# them) and wherever <!-- known-issues: COMPONENT --> stands (one component). tools/test_tools.py checks the file.
#
# An issue stays here when it is fixed: set status: fixed and fixed_in to the version that fixes it, and the page
# moves it to "Fixed". Never renumber: the id is how people refer to an issue.
#
#   id          KI-<number>, never reused
#   component   a key under components:
#   summary     what happens, in one or two sentences
#   workaround  what to do until it is fixed
#   page        the docs page that describes it (path under docs/, an #anchor allowed), and title, its link text
#   status      open or fixed; fixed_in: the version that fixes it (when fixed)
#   since       the date the issue was recorded
#   source      where it is in the code, at the version named under components: (not shown on the page)

components:
  firmware: {name: STEPFOC firmware, version: "110 (the driver's firmware, gripper mode)"}
  spectral_bldc: {name: Python library (Spectral-BLDC), version: "1.21"}
  python_api: {name: PAROL6 Python API (parol6), version: "0.9.1"}

issues:
  - id: KI-1
    component: firmware
    summary: After a gripper command with the E-stop bit set, the E-stop error comes back at every control cycle for
      as long as the last gripper command carries the bit, so a clear seems to do nothing.
    workaround: First send a gripper command with the E-stop bit at 0 and the action bit at 0 (`#Gripstop 0` over
      UART), then clear.
    page: 06-operation/errors.md#clearing
    title: Errors and recovery, clearing
    status: open
    since: 2026-11-03
    source: STEPFOC firmware/src/motor_control.cpp:349-353 (V108)

  - id: KI-2
    component: firmware
    summary: The answer to a full gripper command is sent before the gripper acts on it, so it carries the state from
      before the command, for example object detection 3 of the move before.
    workaround: Ignore that answer, and follow the move with empty Send_gripper_data_pack frames. On firmware 109
      and older, also give a move about 100 ms before you trust its object detection.
    page: 06-operation/how-it-works.md#the-answer
    title: How the gripper works, the answer
    status: open
    since: 2026-11-03
    source: STEPFOC firmware/src/communication_CAN.cpp:413 (V108)

  - id: KI-3
    component: firmware
    summary: A full gripper command or a clear sent while the gripper calibration runs ends it, and the gripper stays
      uncalibrated. The routine's progress and its 24 s timer are not reset, so the next calibration can start part
      way through or give up early.
    workaround: Clear first, then calibrate, and send only empty status polls until the calibrated bit is 1. After an
      interrupted calibration, switch the gripper off and on before you calibrate again.
    page: 06-operation/how-it-works.md#the-states
    title: How the gripper works, the states
    status: fixed
    fixed_in: "110: a new calibration starts from the beginning, with its whole 24 s; a command or a clear still ends a
      running one, and the gripper keeps the calibration it had before"
    since: 2026-11-03
    source: STEPFOC firmware/src/communication_CAN.cpp:367 and :563, motor_control.cpp:2756-2762 and :2876 (V108)

  - id: KI-4
    component: firmware
    summary: The action status in the gripper's answer is the action bit of the last command as it was received; the
      gripper never clears it, so it stays 1 after a move has finished and while the gripper holds.
    workaround: Follow a move by its object detection (0 moving, 1 or 2 object found, 3 at the position), not by the
      action status.
    page: 06-operation/how-it-works.md#the-answer
    title: How the gripper works, the answer
    status: open
    since: 2026-11-03
    source: STEPFOC firmware/src/communication_CAN.cpp:352 (V108)

  - id: KI-5
    component: firmware
    summary: The motor calibration (`#Cal`) leaves the driver's current limit at 1600 mA, whatever it was before, which
      is more than the 21.5 mm stepper's 1.5 A. Gripper moves use the current of each command; the limit applies
      when the driver runs as a motor (Motor GUI's Motor side, the UART motor modes).
    workaround: After `#Cal`, set `#Ilim` to the stepper's maximum current (1500, 2000 or 2100) before `#Save`, or
      apply Motor GUI's MSG preset, which sets the current limit.
    page: build/first-run.md#current-limit
    title: Driver setup, current limit
    status: fixed
    fixed_in: "109: calibration puts back the current limit that was in force when it started"
    since: 2026-11-03
    source: STEPFOC firmware/src/motor_control.cpp:1003, :1055, :1575 (V108)

  - id: KI-6
    component: spectral_bldc
    summary: "`UnpackData` assembles `gripper_object_detection` with its two bits swapped: it reports 1 where the
      gripper sends 2 (object found while opening) and 2 where it sends 1 (object found while closing); 0 and 3 are
      right."
    workaround: Swap 1 and 2 in your program, or test for "1 or 2" when any object will do.
    page: 06-operation/python.md#the-first-program
    title: With Python
    status: fixed
    fixed_in: "1.21: `UnpackData` reads the two bits the right way round"
    since: 2026-11-03
    source: Spectral_BLDC/Spectral_BLDC.py:256 (1.20) against communication_CAN.cpp:1143-1147 (V108)

  - id: KI-7
    component: python_api
    summary: "`tool.status()` does not follow the gripper's status byte: `engaged` reads true at all times, and
      `part_detected` comes from bits 3 and 2 of the byte, which hold the temperature and timeout errors, not the
      object detection. The calibrated and error bits are not in it."
    workaround: Use the jaw position (`positions`) and the current (`channels`), and check where the jaws stopped to
      know that a part is held.
    page: 06-operation/robots.md#driving-it
    title: On PAROL6 and PAR6, driving it
    status: open
    since: 2026-11-03
    source: parol6/tools.py:208-209 and parol6/protocol/wire.py:2294 (v0.9.1)

  - id: KI-8
    component: python_api
    summary: "`calibrate()` counts the calibration done after a fixed 2 s without reading the calibrated bit; the next
      gripper action then ends a calibration that is still running, and the MSG's takes up to about ten seconds. The
      API has no action that clears the gripper's errors."
    workaround: Wait about 10 s after `calibrate()` before the next gripper action. Clear a gripper error with the
      commander's **Clear gripper error** or with Motor GUI, then calibrate.
    page: 06-operation/robots.md#driving-it
    title: On PAROL6 and PAR6, driving it
    status: open
    since: 2026-11-03
    source: parol6/commands/gripper_commands.py:24 (CALIBRATE_TICKS = 200 at 100 Hz), parol6/tools.py:193 (v0.9.1)

  - id: KI-9
    component: python_api
    summary: "The MSG's `current` is a fraction of 100 to 2800 mA, so `current=1.0` commands 2800 mA, more than any of
      the three steppers takes, and the firmware clamps only above 2800 mA."
    workaround: Keep `current` at or below 0.51 (21.5 mm stepper), 0.70 (40 mm) or 0.74 (60 mm).
    page: 06-operation/robots.md#driving-it
    title: On PAROL6 and PAR6, driving it
    status: open
    since: 2026-11-03
    source: parol6/tools.py:835 (v0.9.1)

  - id: KI-10
    component: firmware
    summary: A status poll (an empty Send_gripper_data_pack) or a repeat of the command that reaches the driver within
      one control cycle (about 0.16 ms) of a new move command cancels it as new. The move then runs in position mode,
      and object detection reads 3 while the jaws press on an object.
    workaround: Read the move's answer, or wait a millisecond, before the first poll; the examples on these pages do.
    page: 06-operation/can.md#host-checklist
    title: Over CAN, host checklist
    status: fixed
    fixed_in: "109: only a new command marks itself new, so a poll or a repeat no longer cancels the move"
    since: 2026-11-10
    source: STEPFOC firmware/src/communication_CAN.cpp:330 and :400 (V108)

  - id: KI-11
    component: firmware
    summary: After a move the current took a second or more to settle, and some of it stayed while the gripper held
      the position. The velocity loop carried the current of the move into the hold and unwound it slowly through
      the rail's friction.
    workaround: Update the firmware to 110. The integral deadband (parameter 75) does not help, it keeps the current
      of the move.
    page: 06-operation/how-it-works.md#the-states
    title: How the gripper works, the states
    status: fixed
    fixed_in: "110: the integral is dropped on arrival, the last stretch is slower and the hold has a small dead zone;
      a few mA are left after a move"
    since: 2026-11-13
    source: STEPFOC firmware/src/motor_control.cpp:3093-3172, Gripper_mode (V109)

  - id: KI-12
    component: firmware
    summary: The gripper calibration read the two ends while it pushed into the stops at 500 mA, so positions 0 and
      255 lay inside the stops. A full open or close with less current stopped short, kept pressing on the stop with
      the grip current, and often reported an object (1 or 2) instead of 3.
    workaround: Command positions a few steps inside 0 and 255, or update the firmware to 110.
    page: 06-operation/how-it-works.md#the-states
    title: How the gripper works, the states
    status: fixed
    fixed_in: "110: each end is read under a light 100 mA push; 0 lies 32 encoder ticks inside the open stop, 255 16
      ticks from the closed one"
    since: 2026-11-13
    source: STEPFOC firmware/src/motor_control.cpp:3221 and :3251, Calibrate_gripper (V109)

  - id: KI-13
    component: firmware
    summary: Gripper moves set the driver's current limit (`#Ilim`, parameter 16) to the current of each command, and
      the gripper calibration set it to 500 mA. A Send_Save_config or `#Save` then stored that as the driver's limit.
    workaround: Set `#Ilim` (parameter 16) again right before you save.
    page: build/first-run.md#current-limit
    title: Driver setup, current limit
    status: fixed
    fixed_in: "110: the gripper and its calibration push with their own current; the driver's limit stays as set"
    since: 2026-11-13
    source: STEPFOC firmware/src/motor_control.cpp:3105, :3201 and :3232 (V109)

  - id: KI-14
    component: firmware
    summary: Brake or coast when idle (parameter 18) was not saved. After every power-up the driver braked, whatever
      was set before Send_Save_config.
    workaround: Set brake or coast again after every power-up.
    page: reference/can/system.md#parameters-a-gripper-uses
    title: System, parameters a gripper uses
    status: fixed
    fixed_in: "110: Send_Save_config keeps it; a driver that never saved it brakes, as before"
    since: 2026-11-13
    source: STEPFOC firmware/src/EEPROM.cpp:414, Write_settings2_block (V109)

  - id: KI-15
    component: firmware
    summary: With the watchdog's action set to hold or descend, a watchdog that ran out while the gripper was idle
      started the hold or the descend later, when the next gripper command arrived, for the whole fallback time.
    workaround: Clear the watchdog error before you send the next gripper command.
    page: reference/can/system.md#send_watchdog
    title: System, Send_Watchdog
    status: fixed
    fixed_in: "110: hold and descend start only when the watchdog runs out in gripper mode"
    since: 2026-11-13
    source: STEPFOC firmware/src/motor_control.cpp:718 (V109)
