<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="title desc">
<title id="title">M8 gripper connector, male mating face</title>
<desc id="desc">Staggered four-pin layout: pin 2 CANH at the upper right, pin 1 CANL at the upper left, pin 3 +24 V at the lower left, pin 4 GND at the lower right. The female contact view and the solder side are mirrored.</desc>
<text x="24" y="34" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700" fill="#eef1f5">Gripper end &#183; male mating face</text>
<text x="24" y="60" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#c3cad4">Where the cable plugs in. Match the moulded pin numbers; schematic, not to scale.</text>
<circle cx="370" cy="239" r="140" fill="rgba(255,255,255,0.05)" stroke="#d6dbe2" stroke-width="3"/>
<path d="M426 126 H520" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="410" cy="126" r="14" fill="#2fbf5b" stroke="#eef1f5" stroke-width="2"/>
<text x="534" y="134" text-anchor="start" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">2 &#183; CANH</text>
<path d="M284 188 H220" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="300" cy="188" r="14" fill="#22c3e6" stroke="#eef1f5" stroke-width="2"/>
<text x="206" y="196" text-anchor="end" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">1 &#183; CANL</text>
<path d="M284 280 H220" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="300" cy="280" r="14" fill="#e5484d" stroke="#eef1f5" stroke-width="2"/>
<text x="206" y="288" text-anchor="end" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">3 &#183; +24 V</text>
<path d="M426 352 H520" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="410" cy="352" r="14" fill="#c74ad6" stroke="#eef1f5" stroke-width="2"/>
<text x="534" y="360" text-anchor="start" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">4 &#183; GND</text>
<text x="24" y="414" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#c3cad4">The female cable connector and the solder side are mirrored.</text>
</svg>
