<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">M8 gripper connector, male mating face, as it sits in the gripper</title>
<desc id="desc">pin 2 CANL at the left, pin 4 CANH at the top, pin 3 GND at the right, pin 1 +24 V at the bottom. The female contact view is mirrored.</desc>
<text x="24" y="34" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700" fill="#eef1f5">Gripper end &#183; male mating face</text>
<text x="24" y="60" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#c3cad4">As it sits in the gripper. Match the moulded pin numbers; schematic, not to scale.</text>
<circle cx="380" cy="232" r="128" fill="rgba(255,255,255,0.05)" stroke="#d6dbe2" stroke-width="3"/>
<path d="M291 232 H212" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="308" cy="232" r="15" fill="#22c3e6" stroke="#eef1f5" stroke-width="2"/>
<text x="202" y="240" text-anchor="end" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">2 &#183; CANL</text>
<path d="M397 160 H548" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="380" cy="160" r="15" fill="#2fbf5b" stroke="#eef1f5" stroke-width="2"/>
<text x="558" y="168" text-anchor="start" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">4 &#183; CANH</text>
<path d="M469 232 H548" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="452" cy="232" r="15" fill="#c74ad6" stroke="#eef1f5" stroke-width="2"/>
<text x="558" y="240" text-anchor="start" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">3 &#183; GND</text>
<path d="M397 304 H548" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="380" cy="304" r="15" fill="#e5484d" stroke="#eef1f5" stroke-width="2"/>
<text x="558" y="312" text-anchor="start" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f5">1 &#183; +24 V</text>
<text x="24" y="404" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#c3cad4">The female cable connector and the solder side are mirrored.</text>
</svg>
